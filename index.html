<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===== ページタイトル・メタディスクリプション ===== -->
  <title>HIRAQU｜医師・薬剤師・看護師の適職診断</title>
  <meta name="description" content="HIRAQU(ひらく)は、医師・薬剤師・看護師のための適職診断。19の質問に答えるだけで、あなたの働き方の志向と、国家資格を活かせる向いている仕事がわかります。所要時間は約3分です。">

  <!-- ===== OGP(SNSでシェアされたときの表示) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="HIRAQU｜医師・薬剤師・看護師の適職診断">
  <meta property="og:description" content="19の質問で、あなたの働き方の志向と、国家資格を活かせる向いている仕事がわかります。所要時間は約3分です。">
  <!-- ▼ og:image は images/ogp.png(1200×630px)。画像を差し替えるときは同じファイル名で上書きしてください -->
  <!--   ※ OGPは絶対URLで指定する必要があります。公開URLが変わったらここも変更してください -->
  <meta property="og:image" content="https://k4520428-cmyk.github.io/shimi/images/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HIRAQU 医師・薬剤師・看護師の適職診断">
  <!-- ▼ og:url は公開しているページのURLです -->
  <meta property="og:url" content="https://k4520428-cmyk.github.io/shimi/">
  <!-- ▼ UTMなどのパラメータ付きURLで来ても、検索エンジンには同じページとして扱ってもらう -->
  <link rel="canonical" href="https://k4520428-cmyk.github.io/shimi/">
  <meta property="og:site_name" content="HIRAQU">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- ===== Google Fonts(Zen Maru Gothic:やわらかく読みやすい丸ゴシック / Poppins:ロゴ「HIRAQU」用) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景の装飾(やわらかい円) -->
  <div class="bg-deco" aria-hidden="true">
    <span class="bg-deco__blob bg-deco__blob--mint"></span>
    <span class="bg-deco__blob bg-deco__blob--pink"></span>
  </div>

  <main class="app" id="app">

    <!-- ==================== スタート画面 ==================== -->
    <section class="screen screen--start is-active" id="screen-start" aria-labelledby="start-title">
      <div class="card start">
        <p class="start__badge">資格を活かせる道を、ひらく</p>
        <h1 class="start__title" id="start-title">
          <span class="start__title-line start__logo">HIRAQU</span>
          <span class="start__title-line"><span class="start__title-part">医師・薬剤師・看護師の</span><span class="start__title-part">適職診断</span></span>
        </h1>
        <p class="start__catch">
          <span class="start__catch-part">19の質問から、</span><span class="start__catch-part">あなたの働き方の志向と</span><span class="start__catch-part">国家資格を活かせる、</span><span class="start__catch-part">向いている仕事を</span><span class="start__catch-part">ご提案します。</span>
        </p>
        <ul class="start__meta">
          <li><span class="start__meta-icon" aria-hidden="true">⏱</span>所要時間 約3分</li>
          <li><span class="start__meta-icon" aria-hidden="true">✎</span>全19問・選ぶだけ</li>
          <li><span class="start__meta-icon" aria-hidden="true">✓</span>登録不要で結果がわかる</li>
        </ul>
        <button type="button" class="btn btn--primary btn--large" id="btn-start">
          診断をはじめる
        </button>
        <p class="pr-notice" data-pr-notice></p>
      </div>
    </section>

    <!-- ==================== 質問画面 ==================== -->
    <section class="screen screen--question" id="screen-question" aria-live="polite">
      <div class="card question">
        <!-- プログレスバー -->
        <div class="progress">
          <div class="progress__label">
            <span class="progress__current" id="progress-current">1</span>
            <span class="progress__total"> / <span id="progress-total">19</span>問</span>
          </div>
          <div class="progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="19" aria-valuenow="1" id="progress-bar">
            <div class="progress__fill" id="progress-fill"></div>
          </div>
        </div>

        <!-- 質問本文と選択肢(script.js で差し替え) -->
        <div class="question__body" id="question-body">
          <p class="question__number" id="question-number">Q1</p>
          <h2 class="question__text" id="question-text"></h2>
          <div class="options" id="options" role="list"></div>
        </div>

        <button type="button" class="btn btn--back" id="btn-back">
          <span aria-hidden="true">←</span> 前の質問に戻る
        </button>
      </div>
    </section>

    <!-- ==================== 結果画面 ==================== -->
    <section class="screen screen--result" id="screen-result" aria-labelledby="result-type-name">
      <div class="result">

        <!-- ① タイプ名 -->
        <div class="card result__hero">
          <p class="result__lead">あなたの診断結果</p>
          <p class="result__job" id="result-job"></p>
          <h2 class="result__type-name" id="result-type-name"></h2>
          <p class="result__catch" id="result-catch"></p>
          <!-- X(Twitter)でシェア(リンク先は script.js で設定) -->
          <a class="btn btn--x" data-share-x target="_blank" rel="noopener">
            <svg class="btn--x__logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span>結果をXでシェアする</span>
          </a>
        </div>

        <!-- ② 志向のバランス -->
        <div class="card result__section">
          <h3 class="result__heading">あなたの志向のバランス</h3>
          <div class="traits" id="result-traits"></div>
          <p class="result__text traits__note" id="result-traits-note"></p>
        </div>

        <!-- ③ このタイプの特徴 -->
        <div class="card result__section">
          <h3 class="result__heading">このタイプの特徴</h3>
          <div class="result__features" id="result-features"></div>
          <div class="watch">
            <p class="watch__label">気をつけたいこと</p>
            <p class="watch__text" id="result-watch"></p>
          </div>
        </div>

        <!-- ④ 資格を活かせる仕事(タイプ × 職種) -->
        <div class="card result__section">
          <h3 class="result__heading" id="result-jobs-heading"></h3>
          <p class="result__text" id="result-jobs-lead"></p>
          <div class="job-list" id="result-jobs"></div>
          <p class="job-sub__heading" id="result-subjobs-heading"></p>
          <div class="job-list job-list--sub" id="result-subjobs"></div>
        </div>

        <!-- ⑤ おすすめサービス(職種ごとに1〜2社) -->
        <div class="card result__section">
          <h3 class="result__heading" id="result-services-heading"></h3>
          <p class="result__text" id="result-services-lead"></p>
          <div class="service-list" id="result-services"></div>
          <p class="service-note" id="result-services-note"></p>
        </div>

        <!-- ⑥ 迷っている人への一言 -->
        <div class="card result__section result__message-card">
          <h3 class="result__heading">迷っているあなたへ</h3>
          <p class="result__message" id="result-message"></p>
        </div>

        <!-- ⑦ 次に取るべき行動 -->
        <div class="card result__section">
          <h3 class="result__heading">次にやること</h3>
          <ol class="step-list" id="result-steps"></ol>
        </div>

        <!-- もう一度診断する -->
        <!-- X(Twitter)でシェア(ページ下部) -->
        <div class="result__share">
          <p class="result__share-lead">診断結果をシェアして、まわりの人にも試してもらおう</p>
          <a class="btn btn--x" data-share-x target="_blank" rel="noopener">
            <svg class="btn--x__logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            <span>結果をXでシェアする</span>
          </a>
        </div>

        <div class="result__retry">
          <button type="button" class="btn btn--ghost" id="btn-retry">もう一度診断する</button>
        </div>

        <p class="pr-notice" data-pr-notice></p>
        <p class="disclaimer" id="disclaimer"></p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p class="footer__links"><a href="privacy.html">プライバシーポリシー</a></p>
    <small id="footer-copy"></small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
